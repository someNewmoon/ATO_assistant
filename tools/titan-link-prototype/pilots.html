<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>阿尔戈英雄 · 泰坦接合插画</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="pose-page">
  <nav class="pilot-links" aria-label="原型导航">
    <a class="back" href="./?step=power">战斗面板</a>
    <a class="back" href="./poses.html">喀耳刻加德的动作对照</a>
  </nav>
  <h1>泰坦接合插画</h1>
  <section aria-labelledby="squad">
    <h2 class="pilot-section-title" id="squad">队伍英雄</h2>
    <div class="pose-gallery pilot-gallery">
      <article class="pose-card">
        <a href="../../aibp/images/titan-link/pilot-phenelope.jpg" aria-label="查看菲涅罗珀原图"><img src="../../aibp/images/titan-link/pilot-phenelope.jpg" alt="菲涅罗珀侧身拉回握柄，撼地者的大臂跟着转动"></a>
        <div class="pose-info"><h3>菲涅罗珀</h3><p>撼地者 · 转肩带动巨臂</p></div>
      </article>
      <article class="pose-card">
        <a href="../../aibp/images/titan-link/pilot-olympia.jpg" aria-label="查看奥林匹亚原图"><img src="../../aibp/images/titan-link/pilot-olympia.jpg" alt="奥林匹亚前探抬掌，梭伦的前臂在她头顶护住前方"></a>
        <div class="pose-info"><h3>奥林匹亚</h3><p>梭伦 · 抬掌架住前方</p></div>
      </article>
      <article class="pose-card">
        <a href="../../aibp/images/titan-link/pilot-wu.jpg" aria-label="查看吴京原图"><img src="../../aibp/images/titan-link/pilot-wu.jpg" alt="吴京一手把皮革握环拉向胸口，另一手撑着活体肋骨"></a>
        <div class="pose-info"><h3>吴京</h3><p>尤利西娅 · 拉住握环转身</p></div>
      </article>
    </div>
  </section>
  <section aria-labelledby="defaults">
    <h2 class="pilot-section-title" id="defaults">通用无脸插画</h2>
    <div class="pose-gallery pilot-gallery">
      <article class="pose-card">
        <a href="../../aibp/images/titan-link/pilot-default-rear.jpg" aria-label="查看背影原图"><img src="../../aibp/images/titan-link/pilot-default-rear.jpg" alt="从戴兜帽的驾驶员背后向外看，泰坦双臂伸向前方"></a>
        <div class="pose-info"><h3>越肩背影</h3><p>从驾驶员肩后看出去，能同时看到人和泰坦的双手。</p></div>
      </article>
      <article class="pose-card">
        <a href="../../aibp/images/titan-link/pilot-default-hands.jpg" aria-label="查看第一人称原图"><img src="../../aibp/images/titan-link/pilot-default-hands.jpg" alt="第一人称视角，一只手握住青铜握柄，另一只手贴上活体膜"></a>
        <div class="pose-info"><h3>第一人称</h3><p>只露双手，一手握青铜握柄，一手贴住活体膜。</p></div>
      </article>
      <article class="pose-card">
        <a href="../../aibp/images/titan-link/pilot-default-hood.jpg" aria-label="查看兜帽侧影原图"><img src="../../aibp/images/titan-link/pilot-default-hood.jpg" alt="面部藏在兜帽阴影里的驾驶员压低身体，双手握紧操控柄"></a>
        <div class="pose-info"><h3>兜帽侧影</h3><p>面部藏在兜帽里，身体前倾，双手握紧准备受力。</p></div>
      </article>
    </div>
  </section>
</main>
</body>
</html>
