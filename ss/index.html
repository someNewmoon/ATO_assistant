<style>
.squad-check-overlay{position:fixed;right:clamp(.7rem,3vw,2rem);bottom:clamp(.7rem,3vh,2rem);z-index:2500;display:grid;gap:.45rem;max-width:min(33rem,calc(100vw - 1.4rem));pointer-events:none}
.squad-check-overlay[hidden],.squad-check-overlay article[hidden]{display:none}
.squad-roll-controls{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
.squad-roll-controls button{border:1px solid #a4bd9e;border-radius:7px;background:#232b26f5;color:#fff5e4;padding:.35rem .55rem;font:14px system-ui,sans-serif}
.squad-roll-controls button[aria-pressed="false"]{opacity:.75}
.squad-check-overlay article{background:#232b26f5;color:#fff5e4;border:1px solid #a4bd9e;border-radius:10px;padding:.65rem .85rem;box-shadow:0 3px 20px #0006;font:clamp(15px,2vw,25px) system-ui,sans-serif}
.squad-check-overlay article{max-height:36dvh;overflow:auto;overscroll-behavior:contain;pointer-events:auto}
.squad-roll-entry + .squad-roll-entry{margin-top:.4rem;padding-top:.4rem;border-top:1px solid #a4bd9e55}
#squad-latest-battle:has(.squad-roll-entry + .squad-roll-entry){font-size:clamp(14px,1.3vw,19px)}
.squad-check-overlay strong{display:flex;align-items:center;gap:.35rem;color:#e4cca1}
.squad-roll-avatar{height:1.5em;width:1.5em;border-radius:50%;object-fit:cover;object-position:top}
.squad-roll-faces{display:flex;flex-wrap:wrap;gap:.3rem;margin-block:.3rem}
.squad-roll-faces .room-die-face{display:grid;place-items:center;width:1.65em;height:1.65em;object-fit:contain;background-size:300% 300%}
.squad-roll-votes,.squad-roll-vote-group{display:flex;align-items:center;flex-wrap:wrap;gap:.3rem}
.squad-roll-votes{margin-top:.35rem;gap:.55rem}
.squad-roll-voter{display:inline-grid;place-items:center;width:1.2em;height:1.2em;border-radius:50%;overflow:hidden;background:#41564a;font-size:.85em}
.squad-roll-voter img{width:100%;height:100%;object-fit:cover;object-position:top}
.squad-check-overlay article[data-failed]{border-color:#de9c8d}
.squad-projection-battle{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2100;background:#eee9e0}
.squad-projection-prep{position:fixed;top:1rem;left:1rem;z-index:1100;color:#2c3e32;background:#f9f2e1;border-radius:.5rem;padding:.5rem .8rem}
</style></head>
<body data-theme-module="second-screen">
  <main class="screen-shell">
    <section id="unavailableView" class="pair-view" hidden>
      <div class="pair-card">
        <span class="eyebrow">ATO SECOND SCREEN</span>
        <h1>第二屏幕未开启</h1>
        <p>请先在主控制台开启第二屏幕，本页会自动连接。</p>
        <div id="unavailableMessage" class="pair-message" aria-live="polite"></div>
      </div>
    </section>
    <section class="map-stage" aria-label="辅助地图">
      <iframe id="mapFrame" class="map-frame" title="ATO 辅助地图"></iframe>
    </section>
    <section id="storyView" class="story-view" aria-label="当前故事文本" hidden>
      <article class="story-card">
        <header class="story-card-head">
          <div id="storyBookTitle" class="story-book-title">故事书</div>
          <div id="storySection" class="story-section"></div>
          <h1 id="storyTitle">当前故事文本</h1>
          <div id="storyEntryId" class="story-entry-id"></div>
        </header>
        <div id="storyBody" class="story-body" data-term-ignore></div>
      </article>
      <button id="storyScanToggle" class="story-scan-toggle" type="button" hidden></button>
    </section>
    <section id="battleView" class="battle-view" aria-label="决战版图" hidden>
      <aside class="battle-sidebar">
        <div class="battle-sidebar-content">
          <div class="boss-summary">
            <figure class="boss-panel card-slot tall"><img id="bossPanel" alt="Boss 大卡"><div id="bossTokens" class="boss-token-layer"></div><div id="bossLabyrinthTrack" class="boss-labyrinth-track" hidden></div></figure>
          </div>
          <div class="support-cards" aria-label="Boss 惯常、标志与当前 Trait">
            <figure class="card-slot boss-small-card"><img id="bossRoutine" alt="Boss 惯常"></figure>
            <figure class="card-slot boss-small-card"><img id="bossSignature" alt="Boss 标志"></figure>
            <div id="traitCards" class="trait-cards"></div>
          </div>
          <div class="resolution-panel">
            <section class="aibp-slot" aria-label="AIBP 状态">
              <div class="battle-facts">
                <div><b>AI 卡背</b><span id="aiBacks">—</span></div>
                <div><b>BP 卡背</b><span id="bpBacks">—</span></div>
                <div><b>弃牌</b><span id="discardCounts">—</span></div>
                <div><b>当前损伤</b><span id="damageSummary">0</span></div>
              </div>
              <div id="damageCards" class="damage-cards" aria-label="当前损伤牌" hidden></div>
            </section>
            <div class="pending-cards single-pending" aria-label="正在结算">
              <article class="pending-card"><span id="currentPendingLabel">正在结算</span><div id="currentPending" class="current-card empty-card">未抽取</div></article>
            </div>
          </div>
          <section id="battleTerrainCards" class="battle-terrain-cards" aria-label="当前地形卡" hidden>
            <header class="battle-terrain-cards-head">
              <h2>当前地形卡</h2>
              <span id="battleTerrainCardCount"></span>
            </header>
            <div id="battleTerrainCardList" class="battle-terrain-card-list"></div>
          </section>
        </div>
      </aside>
      <div class="battle-board-stage">
        <div id="battleBoardFrame" class="battle-board-frame">
          <img class="battle-board-image" src="./battle-board/battle-board.jpg" alt="决战版图">
          <div id="battleGrid" class="battle-board-grid" aria-hidden="true"></div>
          <div id="battleTerrainLayer" class="battle-terrain-layer" aria-hidden="true"></div>
          <div id="battleLosLayer" class="battle-map-los-layer" aria-hidden="true" hidden></div>
          <div id="battleStartLayer" class="battle-start-layer" aria-hidden="true"></div>
          <div id="battleCoordinateLayer" class="battle-coordinate-layer" aria-hidden="true"></div>
        </div>
      </div>
    </section>
  </main>
